<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingo Blackout</title>
<style>
:root{--B:#2f7bff;--I:#ff1f78;--N:#8a3ffc;--G:#00a870;--O:#ff8a00;--ink:#2b1b5a;--gold:#ffc400;
  --text:#2b1b5a;--panel:rgba(255,255,255,.92);--solid:#fff;--focus:#2b1b5a;--page:linear-gradient(165deg,#ffe14d 0%,#ff8fab 45%,#8f4dff 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--text:#f4eeff;--panel:rgba(34,22,78,.92);--solid:#241650;--focus:#fff;--page:linear-gradient(165deg,#2a1670 0%,#7a1f68 50%,#16104a 100%)}}
:root[data-theme="dark"]{--text:#f4eeff;--panel:rgba(34,22,78,.92);--solid:#241650;--focus:#fff;--page:linear-gradient(165deg,#2a1670 0%,#7a1f68 50%,#16104a 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:var(--page) fixed;
  padding:max(12px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom))}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border-radius:24px;padding:12px;box-shadow:0 6px 0 rgba(43,27,90,.2)}

h1{margin:0;display:flex;justify-content:center;gap:8px}
h1 span{width:clamp(44px,13vw,58px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-size:clamp(1.6rem,7vw,2.2rem);font-weight:900;background:var(--c);border:4px solid #fff;box-shadow:0 4px 0 rgba(43,27,90,.3);
  animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.15s)}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}

.caller{display:flex;align-items:center;gap:12px}
.ball{--s:clamp(112px,34vw,150px);--c:var(--N);flex:none;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55) 0 10%,transparent 11%),var(--c);box-shadow:0 6px 0 rgba(43,27,90,.28),inset 0 -8px 14px rgba(0,0,0,.18)}
.ball .in{width:78%;height:78%;border-radius:50%;background:#fff;color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.95;font-weight:900}
.ball .l{font-size:calc(var(--s)*.2)}
.ball .n{font-size:calc(var(--s)*.4)}
.ball.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-200deg);opacity:0}100%{transform:none;opacity:1}}
.side{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.count{font-weight:800;font-size:1.05rem;text-align:center}

.btn{font:inherit;font-weight:800;font-size:1rem;line-height:1.1;border:0;border-radius:999px;padding:12px 16px;min-height:50px;background:#fff;color:var(--ink);
  box-shadow:0 4px 0 rgba(43,27,90,.28);border:3px solid var(--ink);cursor:pointer}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(43,27,90,.28)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.cell:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
.btn.primary{background:linear-gradient(#ff5c97,#ff1f78);color:#fff;font-size:1.2rem;min-height:64px}
.btn[aria-pressed="true"]{background:var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row .btn{padding:10px 6px;font-size:.92rem}
.vsel{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:18px;padding:8px 12px;font-weight:800;box-shadow:0 4px 0 rgba(43,27,90,.2)}
.vsel[hidden]{display:none}
.vsel select{flex:1;min-width:0;font:inherit;font-weight:700;font-size:.95rem;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px;min-height:44px}

.heads,.board{display:grid;grid-template-columns:repeat(5,1fr)}
.hd{height:clamp(40px,11vw,52px);margin:0 3px 3px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;font-size:clamp(1.4rem,6vw,1.9rem)}
.cell{--c:var(--B);position:relative;aspect-ratio:1;padding:3px;border:0;background:none;font:inherit;cursor:pointer;touch-action:manipulation}
.ph{position:absolute;inset:0;opacity:0;transition:opacity .7s;background-image:var(--photo);background-size:500% 500%;background-position:var(--x) var(--y)}
.cell:nth-child(1) .ph{border-top-left-radius:16px}.cell:nth-child(5) .ph{border-top-right-radius:16px}
.cell:nth-child(21) .ph{border-bottom-left-radius:16px}.cell:nth-child(25) .ph{border-bottom-right-radius:16px}
.tile{position:relative;z-index:1;width:100%;height:100%;display:grid;place-items:center;border:3px solid var(--c);border-radius:14px;background:#fff;color:var(--ink);
  font-weight:900;font-size:clamp(1.25rem,6.4vw,2rem);transition:transform .4s cubic-bezier(.6,-.4,.7,.4),opacity .4s}
.cell.marked .ph{opacity:1}
.cell.marked .tile{transform:scale(0) rotate(45deg);opacity:0}
.cell.nope .tile{animation:shake .45s;border-color:#e11d48;background:#ffe4ea}
.board.done{border-radius:16px;box-shadow:0 0 0 5px var(--gold),0 0 22px 8px var(--gold)}
.prog{margin:0 0 8px;text-align:center;font-weight:900}
@keyframes shake{20%{transform:translateX(-7px) rotate(-3deg)}40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.msg{min-height:1.4em;margin:10px 0 0;text-align:center;font-weight:800}

.hist-title{margin:0 0 8px;font-size:1.05rem;font-weight:900}
#hist{display:flex;flex-wrap:wrap;gap:6px;max-height:170px;overflow-y:auto}
#hist:empty::before{content:"No numbers yet. Press the big pink button!";font-weight:700;opacity:.7}
.chip{background:var(--c);color:#fff;font-weight:800;border-radius:999px;padding:5px 12px;font-size:.95rem;animation:chip .3s ease-out}
.chip:first-child{outline:3px solid var(--text);outline-offset:1px}
@keyframes chip{from{transform:scale(.4)}}

.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:rgba(43,27,90,.65)}
.overlay[hidden]{display:none}
.winbox{background:var(--solid);border-radius:28px;padding:22px 18px;text-align:center;max-width:420px;width:100%;max-height:100%;overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.25);animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.bingo{font-size:clamp(2.2rem,10vw,3.2rem);font-weight:900;line-height:1;text-shadow:0 4px 0 rgba(43,27,90,.25)}
.winphoto{width:min(100%,50vh);aspect-ratio:1;margin:12px auto 0;border-radius:18px;border:4px solid var(--text);background:var(--photo) center/cover}
.winbox p{font-weight:800;font-size:1.1rem;margin:12px 0 14px}
.winbox .row{grid-template-columns:1fr 1fr}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
@media (prefers-reduced-motion:reduce){h1 span{animation:none}}
</style>
</head>
<body>
<div class="app">
  <h1 aria-label="Bingo">
    <span style="--c:var(--B);--i:0">B</span><span style="--c:var(--I);--i:1">I</span><span style="--c:var(--N);--i:2">N</span><span style="--c:var(--G);--i:3">G</span><span style="--c:var(--O);--i:4">O</span>
  </h1>

  <section class="panel caller">
    <div class="ball" id="ball" aria-live="polite"><div class="in"><span class="l" id="bl">?</span><span class="n" id="bn"></span></div></div>
    <div class="side">
      <div class="count" id="count">0 of 75 called</div>
      <button class="btn primary" id="next">Call Next Number</button>
    </div>
  </section>

  <section class="panel">
    <p class="prog" id="prog"></p>
    <div id="card"><div class="heads" id="heads"></div><div class="board" id="board" role="grid" aria-label="Your bingo card"></div></div>
    <p class="msg" id="msg" aria-live="polite"></p>
  </section>

  <div class="row">
    <button class="btn" id="voice" aria-pressed="true">🔊 Voice: On</button>
    <button class="btn" id="auto" aria-pressed="false">⏱ Auto: Off</button>
    <button class="btn" id="new">🎲 New Game</button>
  </div>
  <label class="vsel" id="vwrap" hidden>Caller voice <select id="vpick"></select></label>

  <section class="panel">
    <h2 class="hist-title">Numbers called</h2>
    <div id="hist"></div>
  </section>
</div>

<div class="overlay" id="win" hidden>
  <div class="winbox" role="dialog" aria-label="Blackout">
    <div class="bingo" id="bt"></div>
    <div class="winphoto"></div>
    <p>You uncovered every square. Look who was hiding! 🐾</p>
    <div class="row"><button class="btn primary" id="again">Play Again</button><button class="btn" id="close">Close</button></div>
  </div>
</div>
<canvas id="confetti"></canvas>

  function nextPhoto() {
    var k = 0;
    if (PHOTOS.length > 1) { k = photoIdx; while (k === photoIdx) k = Math.floor(Math.random() * PHOTOS.length); }
    photoIdx = k;
    document.documentElement.style.setProperty("--photo", 'url("' + PHOTOS[k] + '")');
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function shuffle(a) {
    for (var k = a.length - 1; k > 0; k--) { var r = Math.floor(Math.random() * (k + 1)); var t = a[k]; a[k] = a[r]; a[r] = t; }
    return a;
  }
  function letterIdx(n) { return Math.floor((n - 1) / 15); }

  /* ---------- Sound (Web Audio) ---------- */
  var ac;
  function audio() {
    if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(f, t0, d, o) {
    var a = audio(); if (!a) return;
    o = o || {};
    var osc = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0, v = o.vol || 0.15;
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(a.destination);
    osc.start(t); osc.stop(t + d + 0.05);
  }
  var sfx = {
    call: function () { tone(660, 0, 0.12, { type: "triangle" }); tone(990, 0.09, 0.2, { type: "triangle" }); },
    mark: function () {
      [523, 659, 784, 1047, 1319].forEach(function (f, k) { tone(f, k * 0.055, 0.18, { type: "square", vol: 0.07 }); });
      tone(2093, 0.3, 0.25, { vol: 0.08 });
    },
    nope: function () { tone(230, 0, 0.2, { type: "sawtooth", vol: 0.1, to: 120 }); tone(170, 0.14, 0.26, { type: "sawtooth", vol: 0.1, to: 80 }); },
    win: function () {
      [[523, 0, .12], [523, .13, .12], [523, .26, .12], [659, .4, .25], [784, .62, .12], [659, .76, .12], [784, .9, .2], [1047, 1.15, .7]]
        .forEach(function (n) { tone(n[0], n[1], n[2], { type: "square", vol: 0.09 }); tone(n[0] / 2, n[1], n[2], { type: "triangle", vol: 0.1 }); });
      for (var k = 0; k < 8; k++) tone(1500 + k * 250, 1.2 + k * 0.07, 0.18, { vol: 0.05 });
    }
  };

  /* ---------- Voice ---------- */
  var synth = "speechSynthesis" in window ? window.speechSynthesis : null;
  var chosen = "";
  try { chosen = localStorage.getItem("bingoVoice") || ""; } catch (e) {}

  // Rank voices: favor modern "natural/neural/premium" ones, avoid novelty and robotic ones.
  function score(v) {
    var s = 0, n = v.name;
    if (/natural|neural|online|premium|enhanced|siri/i.test(n)) s += 50;
    if (/aria|jenny|ava|zoe|emma|samantha|karen|moira|serena|allison|susan|tessa|libby|sonia|google us english|google uk english female/i.test(n)) s += 20;
    if (/^en[-_]US/i.test(v.lang)) s += 5; else if (/^en[-_](GB|AU|CA|IE)/i.test(v.lang)) s += 3;
    if (/compact|espeak/i.test(n)) s -= 60;
    if (/\b(bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|zarvox|albert|fred|junior|ralph|kathy|princess)\b/i.test(n)) s -= 80;
    return s;
  }
  function englishVoices() {
    if (!synth) return [];
    return synth.getVoices().filter(function (v) { return /^en/i.test(v.lang); })
      .sort(function (a, b) { return score(b) - score(a); });
  }
  function pickVoice() {
    var list = englishVoices();
    if (chosen) for (var k = 0; k < list.length; k++) if (list[k].name === chosen) return list[k];
    return list[0] || null;
  }
  function fillVoices() {
    var sel = $("vpick"), list = englishVoices();
    $("vwrap").hidden = !list.length;
    if (!list.length) return;
    sel.innerHTML = "";
    var auto = document.createElement("option");
    auto.value = ""; auto.textContent = "Automatic (" + list[0].name + ")";
    sel.appendChild(auto);
    list.forEach(function (v) {
      var o = document.createElement("option");
      o.value = v.name; o.textContent = v.name + " (" + v.lang + ")";
      sel.appendChild(o);
    });
    sel.value = chosen;
    if (sel.value !== chosen) sel.value = "";
  }
  function say(t) {
    if (!voiceOn || !synth) return;
    try {
      synth.cancel();
      var u = new SpeechSynthesisUtterance(t), v = pickVoice();
      if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = 0.92; u.pitch = 1; u.volume = 1;
      synth.speak(u);
    } catch (e) {}
  }

  /* ---------- Effects ---------- */
  function burst(el) {
    var r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var k = 0; k < 14; k++) {
      var p = document.createElement("div"), s = rand(6, 11), ang = (k / 14) * 6.283 + rand(-.2, .2), dist = rand(35, 75);
      p.style.cssText = "position:fixed;z-index:30;pointer-events:none;border-radius:" + (k % 2 ? "50%" : "2px") + ";width:" + s + "px;height:" + s +
        "px;left:" + cx + "px;top:" + cy + "px;background:" + BRIGHT[k % BRIGHT.length];
      document.body.appendChild(p);
      var a = p.animate([
        { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
        { transform: "translate(calc(-50% + " + Math.cos(ang) * dist + "px),calc(-50% + " + Math.sin(ang) * dist + "px)) scale(.3) rotate(200deg)", opacity: 0 }
      ], { duration: rand(500, 800), easing: "cubic-bezier(.2,.8,.3,1)" });
      a.onfinish = (function (n) { return function () { n.remove(); }; })(p);
    }
  }

  var cv = $("confetti"), cx2 = cv.getContext("2d"), parts = [], raf = 0;
  function sizeCv() { var d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cx2.setTransform(d, 0, 0, d, 0, 0); }
  window.addEventListener("resize", sizeCv);
  function addConfetti(n) {
    for (var k = 0; k < n; k++) {
      parts.push({ x: rand(0, innerWidth), y: rand(-innerHeight * 0.7, -10), vx: rand(-1.5, 1.5), vy: rand(2.5, 6), w: rand(7, 13), h: rand(9, 17),
        r: rand(0, 6.28), vr: rand(-.25, .25), c: BRIGHT[Math.floor(Math.random() * BRIGHT.length)] });
    }
  }
  function loop() {
    cx2.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(function (p) {
      p.x += p.vx + Math.sin(p.y / 28) * 0.9; p.y += p.vy; p.r += p.vr;
      cx2.save(); cx2.translate(p.x, p.y); cx2.rotate(p.r); cx2.fillStyle = p.c; cx2.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx2.restore();
    });
    parts = parts.filter(function (p) { return p.y < innerHeight + 30; });
    raf = parts.length ? requestAnimationFrame(loop) : 0;
    if (!raf) cx2.clearRect(0, 0, innerWidth, innerHeight);
  }
  function confetti() {
    sizeCv(); addConfetti(200);
    setTimeout(function () { addConfetti(120); if (!raf) loop(); }, 1500);
    setTimeout(function () { addConfetti(100); if (!raf) loop(); }, 3200);
    if (!raf) loop();
  }

  /* ---------- Game ---------- */
  function setMsg(t, ms) {
    $("msg").textContent = t;
    clearTimeout(msgT);
    if (ms) msgT = setTimeout(function () { $("msg").textContent = won ? "Press New Game to play again." : "Tap a number on your card when it’s called."; }, ms);
  }

  function buildCard() {
    var cols = [0, 1, 2, 3, 4].map(function (c) {
      var a = []; for (var n = c * 15 + 1; n <= c * 15 + 15; n++) a.push(n);
      return shuffle(a).slice(0, 5);
    });
    card = [0, 1, 2, 3, 4].map(function (r) { return cols.map(function (col) { return col[r]; }); });
    marked = card.map(function (row) { return row.map(function () { return false; }); });
  }

  function render() {
    var hd = $("heads"), g = $("board"); hd.innerHTML = ""; g.innerHTML = ""; g.classList.remove("done"); cells = [];
    for (var c = 0; c < 5; c++) {
      var h = document.createElement("div"); h.className = "hd"; h.textContent = LET[c]; h.style.setProperty("--c", COL[c]); hd.appendChild(h);
    }
    for (var r = 0; r < 5; r++) {
      cells.push([]);
      for (var k = 0; k < 5; k++) {
        var b = document.createElement("button"), n = card[r][k];
        b.className = "cell";
        b.style.setProperty("--c", COL[k]);
        b.style.setProperty("--x", k * 25 + "%"); b.style.setProperty("--y", r * 25 + "%");
        b.innerHTML = '<i class="ph"></i><span class="tile">' + n + "</span>";
        b.setAttribute("aria-label", LET[k] + " " + n);
        b.addEventListener("click", (function (rr, cc) { return function () { tap(rr, cc); }; })(r, k));
        g.appendChild(b); cells[r].push(b);
      }
    }
  }

  function remaining() { var m = 0; marked.forEach(function (row) { row.forEach(function (x) { if (!x) m++; }); }); return m; }

  function updateUI() {
    $("count").textContent = called.length + " of 75 called";
    $("prog").textContent = "🐾 Uncovered " + (25 - remaining()) + " of 25 squares";
    $("next").disabled = won || called.length >= 75;
  }

  function showBall(n) {
    var ball = $("ball");
    if (n) { ball.style.setProperty("--c", COL[letterIdx(n)]); $("bl").textContent = LET[letterIdx(n)]; $("bn").textContent = n; }
    else { ball.style.setProperty("--c", "#8a3ffc"); $("bl").textContent = "?"; $("bn").textContent = ""; }
    ball.classList.remove("pop"); void ball.offsetWidth; if (n) ball.classList.add("pop");
  }

  function scheduleAuto(delay) {
    clearTimeout(autoT);
    if (autoOn && !won && called.length < 75) autoT = setTimeout(callNext, delay || AUTO_MS);
  }
  function setAuto(on) {
    autoOn = on;
    $("auto").setAttribute("aria-pressed", on);
    $("auto").textContent = "⏱ Auto: " + (on ? "On" : "Off");
    if (!on) clearTimeout(autoT);
  }

  function callNext() {
    if (won || !pool.length) return;
    var n = pool.pop(), L = LET[letterIdx(n)];
    called.push(n); calledSet[n] = true;
    showBall(n);
    var chip = document.createElement("span");
    chip.className = "chip"; chip.style.setProperty("--c", COL[letterIdx(n)]); chip.textContent = L + "-" + n;
    $("hist").prepend(chip);
    sfx.call(); say(L + ", " + n);
    if (!pool.length) { setAuto(false); setMsg("That was the last number!", 4000); }
    updateUI(); scheduleAuto();
  }

  function tap(r, c) {
    if (won || marked[r][c]) return;
    var n = card[r][c], el = cells[r][c];
    if (calledSet[n]) {
      marked[r][c] = true; el.classList.add("marked"); el.setAttribute("aria-label", LET[c] + " " + n + ", uncovered");
      sfx.mark(); burst(el); updateUI();
      var left = remaining();
      if (left) setMsg("Nice one! " + left + " to go ✨", 1800);
      else { won = true; setAuto(false); winT = setTimeout(win, 900); }
    } else {
      sfx.nope(); setMsg("Not called yet. Keep watching!", 1800);
      el.classList.remove("nope"); void el.offsetWidth; el.classList.add("nope");
      setTimeout(function () { el.classList.remove("nope"); }, 500);
    }
  }

  function win() {
    won = true; setAuto(false);
    $("board").classList.add("done");
    updateUI(); setMsg("Blackout! Press New Game to play again.");
    $("win").hidden = false;
    sfx.win(); say("Blackout! You did it!"); confetti();
  }

  function newGame() {
    clearTimeout(autoT); clearTimeout(msgT); clearTimeout(winT);
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    won = false; called = []; calledSet = {}; pool = shuffle(Array.apply(null, Array(75)).map(function (_, k) { return k + 1; }));
    parts = []; $("win").hidden = true;
    nextPhoto(); buildCard(); render(); showBall(0);
    $("hist").innerHTML = "";
    setMsg("Press Call Next Number to start!");
    updateUI();
    if (autoOn) scheduleAuto(2000);
  }

  $("next").addEventListener("click", function () { audio(); callNext(); });
  $("auto").addEventListener("click", function () {
    audio(); setAuto(!autoOn);
    if (autoOn) { if (!called.length) callNext(); else scheduleAuto(); }
  });
  $("voice").addEventListener("click", function () {
    voiceOn = !voiceOn;
    this.setAttribute("aria-pressed", voiceOn);
    this.textContent = voiceOn ? "🔊 Voice: On" : "🔇 Voice: Off";
    if (!voiceOn && "speechSynthesis" in window) speechSynthesis.cancel();
  });
  var newT = 0;
  function resetNewBtn() { clearTimeout(newT); newT = 0; $("new").textContent = "🎲 New Game"; }
  $("new").addEventListener("click", function () {
    audio();
    if (!won && called.length && !newT) { this.textContent = "Sure? Tap again"; newT = setTimeout(resetNewBtn, 3000); return; }
    resetNewBtn(); newGame();
  });
  $("again").addEventListener("click", function () { audio(); newGame(); });
  $("close").addEventListener("click", function () { $("win").hidden = true; });
  $("vpick").addEventListener("change", function () {
    chosen = this.value;
    try { if (chosen) localStorage.setItem("bingoVoice", chosen); else localStorage.removeItem("bingoVoice"); } catch (e) {}
    audio(); say("B, 12");
  });
  if (synth) { fillVoices(); synth.onvoiceschanged = fillVoices; }
  $("bt").innerHTML = "BLACKOUT!".split("").map(function (ch, k) { return '<span style="color:' + COL[k % 5] + '">' + ch + "</span>"; }).join("");

  newGame();
})();
